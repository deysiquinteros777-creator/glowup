<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Glow Up · Deysi</title>
<style>
:root{--bg:#0d0a0c;--bg2:#151013;--card:#1b1519;--card2:#231b20;--ink:#f5ede4;--muted:#a89a9f;--pri:#d9b77e;--pri2:#c8344f;--gold:#d9b77e;--gold2:#f1dcb4;--red:#c8344f;--ok:#7fd1a4;--bad:#ff5d73;--line:#2e252a;--onpri:#1a1013;
 --serif:"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif}
body.lab{--pri:#c9d3df;--pri2:#5b7896;--onpri:#0f141a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 60% at 50% 0%,#24121a 0%,var(--bg) 60%) fixed;color:var(--ink);font-size:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
body.lab{background:radial-gradient(120% 60% at 50% 0%,#141c26 0%,var(--bg) 60%) fixed}
header{background:linear-gradient(180deg,rgba(13,10,12,.96),rgba(13,10,12,.88));backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);letter-spacing:6px;font-size:12px;color:var(--gold);text-align:center;margin-bottom:6px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
header h1{margin:0;font-family:var(--serif);font-size:27px;font-weight:600;color:var(--ink);letter-spacing:.3px}
header .sub{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:1.5px;text-transform:uppercase}
.mode{display:flex;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:3px;margin-top:12px}
.mode button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px;border-radius:21px;letter-spacing:.5px}
.mode button.on{background:linear-gradient(135deg,var(--gold2),var(--pri));color:var(--onpri)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;padding:0 5px;margin-left:5px;vertical-align:1px}
main{padding:14px 12px;max-width:640px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 12px;color:var(--gold);letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-family:-apple-system,sans-serif;font-size:12px;letter-spacing:0;color:var(--muted);font-weight:500}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;letter-spacing:.6px;text-transform:uppercase}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font-family:inherit;-webkit-appearance:none;color-scheme:dark}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
::placeholder{color:#6f6268}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{font-family:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--pri);background:transparent;color:var(--pri);font-weight:600;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--gold2),var(--pri));color:var(--onpri);border-color:transparent}
button.ghost{border-color:transparent}
button.danger{border-color:var(--bad);color:var(--bad)}
button.full{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500}
.chip.on{background:linear-gradient(135deg,var(--gold2),var(--pri));border-color:transparent;color:var(--onpri)}
.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hab{border:1px solid var(--line);border-radius:15px;padding:12px 10px;background:var(--bg2);text-align:left;color:var(--ink);font-weight:500;font-size:14px;display:flex;gap:8px;align-items:center;min-height:60px;transition:all .2s}
.hab .ic{font-size:22px}
.hab.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(217,183,126,.18),rgba(200,52,79,.12));box-shadow:0 0 14px rgba(217,183,126,.15)}
.hab.on::after{content:"✦";margin-left:auto;color:var(--gold);font-weight:800}
.hero{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.hero .t{font-size:14px;color:var(--muted);line-height:1.45}
.hero .t b{color:var(--ink);font-family:var(--serif);font-size:20px;display:block;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:13px}
.kpi .v{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--gold)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.alert{background:rgba(200,52,79,.12);border:1px solid rgba(255,93,115,.35);color:#ffc7cf;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.5}
.tip{background:rgba(217,183,126,.08);border:1px solid rgba(217,183,126,.25);color:var(--ink);border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:10px}
.avisos .tip{display:flex;gap:8px;align-items:flex-start}
.mentor{border:1px solid rgba(217,183,126,.45);background:linear-gradient(160deg,#2a1820 0%,#17111a 70%);position:relative;overflow:hidden}
.mentor::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(200,52,79,.35),transparent 70%)}
body.lab .mentor{background:linear-gradient(160deg,#16202b 0%,#11161d 70%)}
body.lab .mentor::before{background:radial-gradient(circle,rgba(91,120,150,.4),transparent 70%)}
.mentor .who{font-family:var(--serif);color:var(--gold);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.msg{font-family:var(--serif);font-size:18px;line-height:1.4;color:var(--ink);margin:0 0 12px;position:relative}
.msg:last-child{margin-bottom:0}
.msg .tag{display:block;font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:3px;font-weight:700}
.msg.good .tag{color:var(--ok)}
.msg .do{display:block;font-family:-apple-system,sans-serif;font-size:13px;color:var(--gold2);margin-top:5px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{font-family:var(--serif);font-size:17px;font-weight:600}.nav button{padding:8px 14px}
.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid #5d4f55;flex:none;background:transparent;padding:0;margin-top:1px;color:var(--onpri)}
.task.done .ck{background:var(--gold);border-color:var(--gold)}
.task.done .ck::after{content:"✓";font-size:14px}
.task .b{flex:1;min-width:0}
.task .tt{font-size:15px;font-weight:500;word-break:break-word}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .mt{font-size:12px;color:var(--muted);margin-top:3px}
.task .mt .od{color:var(--bad);font-weight:600}
.pr{width:3px;align-self:stretch;border-radius:2px;flex:none}
.pr.alta{background:var(--red)}.pr.media{background:var(--gold)}.pr.baja{background:#4d4247}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 0;font-style:italic}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--pri));color:var(--onpri);font-size:30px;border:0;box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px rgba(217,183,126,.25);z-index:8;padding:0;line-height:58px}
.mv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.mv:last-child{border-bottom:0}.mv small{display:block;color:var(--muted);font-size:12px}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.bar{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
.menu button{display:flex;text-align:left;gap:8px;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 4px;background:none;color:var(--ink);font-weight:500;font-size:16px}
.menu button:last-child{border-bottom:0}.menu button::after{content:"›";color:var(--gold);font-size:20px}
.ed{display:flex;gap:6px;align-items:center;margin-bottom:6px}.ed input[type=text]{flex:1}.ed .ico{width:52px;text-align:center;flex:none}
.ed button{padding:8px 11px}
.counter{display:flex;align-items:center;gap:16px;justify-content:center}.counter button{width:48px;height:48px;border-radius:50%;font-size:22px;padding:0}.counter b{font-family:var(--serif);font-size:36px;min-width:50px;text-align:center;color:var(--gold)}
.hidden{display:none!important}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(13,10,12,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;border-radius:0;background:none;color:#7d6f75;font-size:10px;padding:9px 0 9px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
nav.tabs button span{display:block;font-size:20px;margin-bottom:2px;letter-spacing:0}
nav.tabs button.on{color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-top:1px solid var(--gold);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold)}
.sheet .card{background:var(--card)}
.sheet .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.sheet .acts button{flex:1}
svg text{font-size:10px;fill:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(156px + env(safe-area-inset-bottom));background:linear-gradient(135deg,var(--gold2),var(--pri));color:var(--onpri);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.toast.show{opacity:.97}
.quote{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold2);border-left:2px solid var(--red);padding-left:10px;line-height:1.45}
input[type=checkbox]{accent-color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="brand">✦ G L O W &nbsp; U P ✦</div>
  <div class="hrow"><div><h1 id="hello">Hola, Deysi</h1><div class="sub" id="sub"></div></div></div>
  <div class="mode"><button data-mode="personal" class="on">✦ Personal<span id="bp"></span></button><button data-mode="laboral">💼 Laboral<span id="bl"></span></button></div>
</header>
<main id="app"></main>
<button class="fab hidden" id="fab">+</button>
<div class="toast" id="toast"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheetRoot"></div>
<script>
/* =========================================================
   GLOW UP v2 · Datos guardados SOLO en este teléfono
   ========================================================= */
const KEY='glowup_v1';
const DEF={
  settings:{nombre:'Deysi',wakeGoal:'07:30',sleepGoal:'22:45',redesMax:60,mlTrago:30,grad:30},
  habits:[{id:'h_wake',ic:'⏰',name:'Me levanté a mi hora',on:true},{id:'h_move',ic:'💪',name:'Entrené / caminé / bailé 30 min',on:true},{id:'h_home',ic:'🏠',name:'Ordené la casa 15 min',on:true},{id:'h_joy',ic:'🎤',name:'Canté o bailé por gusto',on:true},{id:'h_redes',ic:'📵',name:'Redes dentro del límite',on:true},{id:'h_skin',ic:'✨',name:'Rutina de piel noche',on:true}],
  persTypes:['Casa','Salud','Belleza','Finanzas','Trámites','Personal'],
  workTypes:['Llamar','Visitar','Cotizar','Enviar propuesta','Seguimiento','Reunión','Administrativo'],
  gastoCats:['Vivienda','Comida','Transporte','Servicios','Pago de deudas','Belleza','Salidas','Alcohol','Otros'],
  ingresoCats:['Sueldo','Comisiones','Extra'],
  days:{},weeks:{},months:{},tasks:[],moves:[],debts:[],lastBackup:null
};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
for(const k in DEF){if(S[k]==null)S[k]=structuredClone(DEF[k])}
S.settings=Object.assign({},DEF.settings,S.settings);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}}
save();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const QUOTES=['No necesitas otro sistema: necesitas usar el que tienes.','Constancia antes que perfección.','Una mala semana no es fracaso. Ajusta y sigue.','Decide con hechos, no con la emoción del momento.','Cumple lo que te prometes: así se construye la confianza.','Haz la acción mínima. Lo pequeño hecho vale más que lo grande pensado.','Primero lo importante; después lo urgente de otros.'];

/* ===== Fechas (DD/MM/AAAA) ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>s?s.split('-').reverse().join('/'):'';
const fmtS=s=>{if(!s)return'';const t=today();if(s===t)return'Hoy';if(s===addDays(t,1))return'Mañana';if(s===addDays(t,-1))return'Ayer';return fmt(s).slice(0,5)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=parse(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const today=()=>iso(new Date());
const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const money=v=>v==null?'—':'$'+(+v).toLocaleString('es-EC',{minimumFractionDigits:2,maximumFractionDigits:2});

let cur={mode:'personal',tab:'hoy',sub:null,day:today(),week:monday(today()),month:today().slice(0,7),range:7,tf:'pend',lf:'pend',ltype:''};
let draft=null,sheetKind=null;

/* ===== Enlace campo → dato ===== */
function getRef(path){const p=path.split('|');let o=S;for(let i=0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}return[o,p[p.length-1]]}
const val=path=>{const[o,k]=getRef(path);return o[k]};
const inp=(path,type='text',ph='',extra='')=>`<input type="${type}" data-k="${path}" value="${esc(val(path))}" placeholder="${esc(ph)}" ${type==='number'?'inputmode="decimal" step="any"':''} ${extra}>`;
const area=(path,ph='')=>`<textarea data-k="${path}" placeholder="${esc(ph)}">${esc(val(path))}</textarea>`;
const dinp=(f,type='text',ph='')=>`<input type="${type}" data-d="${f}" value="${esc(draft[f])}" placeholder="${esc(ph)}" ${type==='number'?'inputmode="decimal" step="any"':''}>`;
const chips=(f,opts,cls='')=>`<div class="chips">${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<button class="chip ${draft[f]===v?'on':''}" data-dpick="${f}" data-v="${esc(v)}">${esc(l)}</button>`}).join('')}</div>`;

document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k){const[o,f]=getRef(t.dataset.k);o[f]=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;save();if(t.dataset.live!==undefined)live()}
  if(t.dataset.d&&draft){draft[t.dataset.d]=t.type==='number'?(t.value===''?'':+t.value):t.value}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.k&&(t.type==='checkbox'||t.tagName==='SELECT'||t.dataset.rr!==undefined))render()});

/* ===== Cálculos ===== */
const D=k=>S.days[k]||{};
const habitsOn=()=>S.habits.filter(h=>h.on);
function habitPct(d){const hs=habitsOn();if(!hs.length)return 0;return hs.filter(h=>d[h.id]).length/hs.length}
const hasData=d=>d&&Object.keys(d).some(k=>d[k]!==''&&d[k]!==false&&d[k]!=null);
function sleepHours(d){if(!d.dormi||!d.desperte)return null;const[a,b]=d.dormi.split(':').map(Number),[c,e]=d.desperte.split(':').map(Number);let m=(c*60+e)-(a*60+b);if(m<=0)m+=1440;return m/60}
function stdDrinks(d){if(!d||d.alc!=='si')return 0;const n=num(d.alc_n),ml=num(d.alc_ml)??S.settings.mlTrago,g=num(d.alc_grad)??S.settings.grad;return n==null?0:n*ml*(g/100)*0.789/14}
function streak(){let s=0,k=today();if(!habitsOn().some(h=>D(k)[h.id]))k=addDays(k,-1);while(habitsOn().some(h=>D(k)[h.id])){s++;k=addDays(k,-1)}return s}
const isOver=t=>!t.done&&t.due&&t.due<today();
const isToday=t=>!t.done&&t.due===today();
function tasks(area,f){const T=today();let L=S.tasks.filter(t=>t.area===area);
  if(f==='hoy')L=L.filter(t=>!t.done&&(!t.due||t.due<=T));
  else if(f==='pend')L=L.filter(t=>!t.done);
  else if(f==='prox')L=L.filter(t=>!t.done&&t.due&&t.due>T);
  else if(f==='venc')L=L.filter(isOver);
  else if(f==='hech')L=L.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  if(f!=='hech'){const pr={alta:0,media:1,baja:2};L.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'99').localeCompare(b.time||'99')||pr[a.prio]-pr[b.prio])}
  return L}
function monthMoves(M){return S.moves.filter(m=>m.date&&m.date.slice(0,7)===M)}

/* ===== Componentes ===== */
function ring(p,size=74,txt){const r=size/2-7,c=2*Math.PI*r;return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1dcb4"/><stop offset="1" stop-color="#c8344f"/></linearGradient></defs><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2e252a" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#gg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" style="font-size:19px;font-weight:600;fill:#f5ede4;font-family:Didot,Bodoni 72,Georgia,serif">${txt??Math.round(p*100)+'%'}</text></svg>`}
function taskRow(t){const tp=[t.type,t.cliente].filter(Boolean).join(' · ');const when=t.due?(isOver(t)?`<span class="od">Vencido ${fmtS(t.due)}</span>`:fmtS(t.due))+(t.time?' '+t.time:''):'Sin fecha';
  return `<div class="task ${t.done?'done':''}"><div class="pr ${t.prio||'media'}"></div><button class="ck" data-act="tdone" data-id="${t.id}"></button><div class="b" data-act="tedit" data-id="${t.id}"><div class="tt">${esc(t.title)}</div><div class="mt">${when}${tp?' · '+esc(tp):''}${t.repeat&&t.repeat!=='no'?' · 🔁 '+t.repeat:''}</div></div></div>`}
function taskList(L,empty='Nada pendiente aquí ✨'){return L.length?L.map(taskRow).join(''):`<div class="empty">${empty}</div>`}

function mentora(area){const T=today(),y=addDays(T,-1),L7=[...Array(7)].map((_,i)=>addDays(T,i-6)),P7=L7.slice(0,6),h=new Date().getHours();const out=[];
  const M=T.slice(0,7),mm=monthMoves(M),gas=mm.filter(x=>x.kind==='gasto').reduce((a,x)=>a+(+x.amount||0),0),ing=mm.filter(x=>x.kind==='ingreso').reduce((a,x)=>a+(+x.amount||0),0);

    const cita=Object.values(S.weeks).some(w=>w.cita)||S.tasks.some(t=>/cita/i.test(t.title)&&t.done);

    if(!D(y).alc&&!D(T).alc)add(2,'Honestidad','No registraste el alcohol de ayer. Lo que no mides, no lo puedes cambiar.','Pestaña Alcohol → día anterior → 30 segundos.');
    const noMove=[0,1,2].every(i=>!D(addDays(T,-i-1)).h_move)&&!D(T).h_move;
    if(noMove&&Object.keys(S.days).length>=3)add(4,'Cuerpo','Llevas 3 días sin moverte. No necesitas un plan perfecto: necesitas 20 minutos hoy.','Pon tu canción favorita y baila 20 min. Cuenta.');
    const rd=L7.map(k=>num(D(k).redes)).filter(v=>v!=null);if(rd.length>=2){const av=rd.reduce((a,b)=>a+b,0)/rd.length;if(av>S.settings.redesMax)add(5,'Disciplina',`Promedias ${Math.round(av)} min al día en redes: ${Math.round(av-S.settings.redesMax)} min sobre tu límite. Ahí está tu hora de Glow Up.`,'Deja el teléfono fuera del cuarto esta noche.')}
    if(ing&&gas>ing)add(2,'Dinero',`Este mes gastaste ${money(gas)} y ganaste ${money(ing)}. No es momento de compras: es momento de cortar.`,'Revisa en Dinero tu categoría más alta y recórtala esta semana.');

    if(!S.debts.length)add(4,'Dinero','Aún no registras tus deudas. No puedes pagar lo que no quieres ver.','Dinero → Agregar deuda, con saldo y cuota. 5 minutos.');
    const lastMv=S.moves.map(m=>m.date).sort().pop();if(S.moves.length&&lastMv<addDays(T,-3))add(5,'Dinero','Hace más de 3 días que no anotas un gasto. ¿De verdad no gastaste nada?','Anota hoy lo que recuerdes de estos días.');
    if(!D(T).prioridad&&h>=10)add(4,'Enfoque',`Son las ${h}:00 y no definiste tu prioridad. Sin prioridad, el día lo deciden otros.`,'Escríbela arriba: una sola cosa.');
    const sl=L7.map(k=>sleepHours(D(k))).filter(Boolean);if(sl.length>=3){const a=sl.reduce((x,z)=>x+z,0)/sl.length;if(a<6.5)add(5,'Descanso',`Duermes ${a.toFixed(1)} h en promedio. Con ese sueño la disciplina se vuelve cuesta arriba.`,`Meta de esta semana: acostarte a las ${S.settings.sleepGoal}.`)}
    const ovP=S.tasks.filter(t=>t.area==='personal'&&isOver(t)).length;if(ovP>=3)add(5,'Orden',`Acumulas ${ovP} tareas personales vencidas. Estás postergando, no organizando.`,'Elige una, hazla en 15 minutos, y reprograma o borra el resto.');
    const st=streak();if(st>=3)add(9,'Reconocimiento',`Racha de ${st} días seguidos. Eso es disciplina real, no motivación.`,'',true);
    if(habitPct(D(T))===1)add(8,'Reconocimiento','Cumpliste todos tus hábitos hoy. Así se ve una mujer que cumple lo que promete.','',true);
    if(alc7===0&&L7.filter(k=>D(k).alc==='no').length>=5)add(8,'Reconocimiento','Una semana sin alcohol registrada. Eso merece reconocimiento, y seguimiento médico para sostenerlo.','',true);
  }else{

function vTablero(){const n=cur.range,ds=[...Array(n)].map((_,i)=>addDays(today(),i-n+1));let reg=0,hab=0,alc=0,std=0,slp=0,sN=0,red=0,rN=0,seg=0;

  <div class="kpi"><div class="v">${rN?Math.round(red/rN):'—'}</div><div class="l">Min/día en redes</div></div><div class="kpi"><div class="v">${money(gas)}</div><div class="l">Gastos registrados</div></div>
  <div class="kpi"><div class="v">${dn(pt)}</div><div class="l">Tareas personales hechas</div></div><div class="kpi"><div class="v">${dn(lt)} · ${seg}</div><div class="l">Pendientes laborales · seguimientos</div></div></div>
  <div class="card"><h2>Hábitos por día</h2>${bars(ds.slice(-14).map(k=>[parse(k).getDate(),Math.round(habitPct(D(k))*100)]),'#c8344f')}</div>
  <div class="card"><h2>Peso semanal (lb)</h2>${line(peso,'lb')}<p class="note">El peso es complementario: mira también fuerza y constancia.</p></div>`}

/* ===== Recordatorios: archivo de calendario con alarma ===== */
const VTZ='BEGIN:VTIMEZONE\r\nTZID:America/Guayaquil\r\nBEGIN:STANDARD\r\nDTSTART:19700101T000000\r\nTZOFFSETFROM:-0500\r\nTZOFFSETTO:-0500\r\nTZNAME:ECT\r\nEND:STANDARD\r\nEND:VTIMEZONE';
async function icsOpen(title,date,time,rrule,desc){const dt=date.replace(/-/g,'')+'T'+(time||'09:00').replace(':','')+'00';const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';const cl=x=>x.replace(/\n/g,' ').replace(/[,;]/g,' ');
  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GlowUp Deysi//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',VTZ,'BEGIN:VEVENT','UID:'+uid()+'@glowup','DTSTAMP:'+now,'DTSTART;TZID=America/Guayaquil:'+dt,'DURATION:PT15M','SUMMARY:'+cl(title),
    desc?'DESCRIPTION:'+cl(desc):'',rrule?'RRULE:'+rrule:'','BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+cl(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n')+'\r\n';
  const file=new File([t],'recordatorio.ics',{type:'text/calendar'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download='recordatorio.ics';a.click()}
const REM={dia:['✦ Glow Up: registra tu día','21:30','FREQ=DAILY'],manana:['✦ Glow Up: elige tu prioridad','07:45','FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'],gasto:['✦ Glow Up: anota tus gastos','20:00','FREQ=DAILY'],semana:['✦ Glow Up: revisión semanal + respaldo','19:00','FREQ=WEEKLY;BYDAY=SU'],seg:['💼 Revisar pendientes y seguimientos','08:30','FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR']};

/* ===== Acciones ===== */
function saveTask(){if(!draft.title||!draft.title.trim()){toast('Escribe qué hay que hacer');return false}
  const i=S.tasks.findIndex(t=>t.id===draft.id);if(i>=0)S.tasks[i]=draft;else{draft.id=uid();draft.created=today();S.tasks.push(draft)}save();return true}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;
  if(t.done&&t.repeat&&t.repeat!=='no'&&!t.spawned){const base=t.due||today();let nd;if(t.repeat==='diario')nd=addDays(base,1);else if(t.repeat==='semanal')nd=addDays(base,7);else{const d=parse(base);d.setMonth(d.getMonth()+1);nd=iso(d)}
    S.tasks.push(Object.assign({},t,{id:uid(),done:false,doneAt:null,due:nd,spawned:false}));t.spawned=true}
  save();if(t.done)toast(t.area==='laboral'?'Cerrado ✓ Bien hecho':'Hecho ✓')}
function newTask(area,extra){openSheet('task',Object.assign({area,title:'',type:'',cliente:'',due:today(),time:'',prio:'media',repeat:'no',notes:'',done:false},extra||{}))}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab],[data-mode],[data-sub],[data-set],[data-go],[data-wk],[data-mo],[data-dpick]');if(!b)return;const ds=b.dataset;
  if(ds.act==='ovclose'){if(e.target===b)closeSheet();return}
  if(ds.dpick){draft[ds.dpick]=draft[ds.dpick]===ds.v&&ds.dpick==='type'?'':ds.v;if(ds.dpick==='kind')draft.cat='';drawSheet();return}
  if(ds.mode){cur.mode=ds.mode;cur.tab=ds.mode==='laboral'?'lhoy':'hoy';cur.sub=null;window.scrollTo(0,0)}
  else if(ds.tab!==undefined){cur.tab=ds.tab;cur.sub=null;if(ds.tab==='alcohol')cur.day=today();window.scrollTo(0,0)}
  else if(ds.sub!==undefined){cur.sub=ds.sub||null;window.scrollTo(0,0)}
  else if(ds.set){cur[ds.set]=ds.set==='range'?+ds.v:ds.v}
  else if(ds.go){const n=addDays(cur.day,+ds.go);if(n<=today())cur.day=n}
  else if(ds.wk)cur.week=addDays(cur.week,+ds.wk);
  else if(ds.mo){const[y,m]=cur.month.split('-').map(Number);const d=new Date(y,m-1+(+ds.mo),1);cur.month=d.getFullYear()+'-'+pad(d.getMonth()+1)}
  else switch(ds.act){
   case 'hab':{const[o]=getRef('days|'+today()+'|x');o[ds.id]=!o[ds.id];save();if(o[ds.id]&&habitPct(o)===1)toast('🔥 ¡Todos tus hábitos de hoy!');break}
   case 'alc':{const[o]=getRef('days|'+cur.day+'|alc');o.alc=ds.v;save();break}
   case 'seg':{const[o]=getRef('days|'+today()+'|seg');o.seg=Math.max(0,(num(o.seg)||0)+(+ds.v));save();break}
   case 'tdone':toggleTask(ds.id);break;
   case 'tedit':{const t=S.tasks.find(x=>x.id===ds.id);if(t)openSheet('task',structuredClone(t));return}
   case 'newtask':newTask('personal');return;
   case 'tsave':if(saveTask()){closeSheet();toast('Guardado ✓')}else return;break;
   case 'tdel':if(confirm('¿Eliminar este pendiente?')){S.tasks=S.tasks.filter(t=>t.id!==draft.id);save();closeSheet()}else return;break;
   case 'tics':if(!draft.title){toast('Escribe primero el título');return}if(!draft.time){toast('Elige una hora para el aviso');return}
     icsOpen((draft.area==='laboral'?'💼 ':'✦ ')+draft.title+(draft.cliente?' · '+draft.cliente:''),draft.due||today(),draft.time,{diario:'FREQ=DAILY',semanal:'FREQ=WEEKLY',mensual:'FREQ=MONTHLY'}[draft.repeat],draft.notes);saveTask();return;
   case 'quick':if(ds.v==='cita')newTask('personal',{title:'Agendar cita médica (valoración consumo de alcohol)',type:'Salud',prio:'alta'});return;
   case 'mvnew':openSheet('move',{kind:ds.v,amount:'',cat:'',date:today(),note:''});return;
   case 'mvedit':{const m=S.moves.find(x=>x.id===ds.id);if(m)openSheet('move',structuredClone(m));return}
   case 'mvsave':if(!(+draft.amount>0)){toast('Escribe el monto');return}if(!draft.cat){toast('Elige una categoría');return}
     {const i=S.moves.findIndex(x=>x.id===draft.id);if(i>=0)S.moves[i]=draft;else{draft.id=uid();S.moves.push(draft)}save();cur.month=draft.date.slice(0,7);closeSheet();toast('Guardado ✓');break}
   case 'mvdel':if(confirm('¿Eliminar este movimiento?')){S.moves=S.moves.filter(x=>x.id!==draft.id);save();closeSheet()}else return;break;
   case 'dbnew':openSheet('debt',{name:'',saldo:'',cuota:'',tasa:''});return;
   case 'dbedit':{const x=S.debts.find(d=>d.id===ds.id);if(x)openSheet('debt',structuredClone(x));return}
   case 'dbsave':if(!draft.name){toast('Ponle un nombre');return}{const i=S.debts.findIndex(x=>x.id===draft.id);if(i>=0)S.debts[i]=draft;else{draft.id=uid();S.debts.push(draft)}save();closeSheet();break}
   case 'dbdel':if(confirm('¿Eliminar esta deuda?')){S.debts=S.debts.filter(x=>x.id!==draft.id);save();closeSheet()}else return;break;
   case 'close':closeSheet();return;
   case 'habon':S.habits[+ds.i].on=!S.habits[+ds.i].on;save();break;
   case 'ldel':if(!confirm('¿Eliminar este elemento de la lista?'))return;S[ds.l].splice(+ds.i,1);save();break;
   case 'ladd':S[ds.l].push(ds.l==='habits'?{id:'h_'+uid(),ic:'⭐',name:'Nuevo hábito',on:true}:'Nuevo');save();break;
   case 'rem':{window.open(new URL('rem-'+ds.v+'.ics',location.href).href,'_blank');return}
   case 'backup':backup();return;
   case 'restore':document.getElementById('file').click();return;
   default:return}
  render()});

async function backup(){const name='glowup-respaldo-'+today()+'.json';const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:name});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
  S.lastBackup=Date.now();save();render();toast('Respaldo creado ✓')}catch(err){if(err.name!=='AbortError')toast('No se pudo respaldar')}}
document.addEventListener('change',e=>{if(e.target.id!=='file')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.days)throw 0;if(confirm('¿Reemplazar los datos actuales por los del respaldo?')){S=d;for(const k in DEF)if(S[k]==null)S[k]=structuredClone(DEF[k]);save();render();toast('Datos restaurados ✓')}}catch(_){toast('Archivo no válido')}};r.readAsText(f)});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900)}

/* ===== Render ===== */
function live(){const d=D(cur.tab==='alcohol'?cur.day:today());const sc=document.getElementById('sleepcalc');if(sc){const s=sleepHours(d);sc.textContent=s?`Dormiste ${s.toFixed(1)} h · meta: dormir ${S.settings.sleepGoal}, levantarte ${S.settings.wakeGoal}`:''}
  const ac=document.getElementById('alccalc');if(ac){const s=stdDrinks(d);ac.innerHTML=s?`≈ <b>${s.toFixed(1)} tragos estándar</b> (${(s*14).toFixed(0)} g de alcohol puro)`:''}}
const TABS={personal:[['hoy','☀︎','Hoy'],['tareas','✓','Tareas'],['dinero','$','Dinero'],['alcohol','♡','Alcohol'],['mas','☰','Más']],laboral:[['lhoy','◉','Hoy'],['pend','☷','Pendientes'],['resumen','▦','Resumen'],['mas','☰','Más']]};
function render(){const lab=cur.mode==='laboral';document.body.classList.toggle('lab',lab);
  const V={hoy:pHoy,tareas:pTareas,dinero:pDinero,alcohol:pAlcohol,lhoy:lHoy,pend:lPend,resumen:lResumen,mas:vMas}[cur.tab];
  document.getElementById('app').innerHTML=V();
  document.getElementById('tabs').innerHTML=TABS[cur.mode].map(([k,i,l])=>`<button data-tab="${k}" class="${cur.tab===k?'on':''}"><span>${i}</span>${l}</button>`).join('');
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===cur.mode));
  const ovP=S.tasks.filter(t=>t.area==='personal'&&isOver(t)).length,ovL=S.tasks.filter(t=>t.area==='laboral'&&isOver(t)).length;
  document.getElementById('bp').innerHTML=ovP?`<span class="badge">${ovP}</span>`:'';document.getElementById('bl').innerHTML=ovL?`<span class="badge">${ovL}</span>`:'';
  const h=new Date().getHours();document.getElementById('hello').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+', '+(S.settings.nombre||'Deysi');
  document.getElementById('sub').textContent=DOW[new Date().getDay()]+' '+fmt(today());
  document.getElementById('fab').classList.toggle('hidden',['mas','alcohol','resumen'].includes(cur.tab));
  document.querySelector('meta[name=theme-color]').content=lab?'#0d0a0c':'#0d0a0c';live()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
render();
</script>
